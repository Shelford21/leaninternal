version: "3.8"

services:
  # ── Next.js Fullstack App (Frontend + API) ───────────────
  app:
    build:
      context: ./lems-frontend
      dockerfile: Dockerfile
    container_name: kinglean2-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-mysql://root:secret@db:3306/lean_ie}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me}
      - NEXTAUTH_URL=${APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kinglean2-net

  # ── MySQL Database ───────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: kinglean2-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-lean_ie}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kinglean2-net

volumes:
  db_data:

networks:
  kinglean2-net:
    driver: bridge