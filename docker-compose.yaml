version: "3.8"

services:
  # ── Laravel API Backend ──────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: kinglean2-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-lean_ie}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    networks:
      - kinglean2-net

  # ── Next.js Frontend ─────────────────────────────────────
  frontend:
    build:
      context: ./lems-frontend
      dockerfile: ../Dockerfile.frontend
    container_name: kinglean2-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${APP_URL:-http://localhost:8000}
      - DATABASE_URL=${DATABASE_URL:-mysql://root:secret@db:3306/lean_ie}
    depends_on:
      - backend
    networks:
      - kinglean2-net

  # ── MySQL Database ───────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: kinglean2-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-lean_ie}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kinglean2-net

volumes:
  db_data:
  storage_app:
  storage_logs:

networks:
  kinglean2-net:
    driver: bridge