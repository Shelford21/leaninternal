version: "3.8"

services:
  # ── Next.js Fullstack App (Frontend + API routes) ───────
  app:
    build:
      context: ./lems-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-LEAN ENTERPRISE}
    container_name: kinglean2-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://${DB_USERNAME:-root}:${DB_PASSWORD:-secret}@db:3306/${DB_DATABASE:-lean_ie}
      - LEAN_API_URL=${LEAN_API_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-LEAN ENTERPRISE}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kinglean2-net

  # ── MySQL Database ───────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: kinglean2-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-lean_ie}
      MYSQL_USER: ${DB_USERNAME:-mysql}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kinglean2-net

volumes:
  db_data:

networks:
  kinglean2-net:
    driver: bridge